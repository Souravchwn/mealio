spring:
  config:
    activate:
      on-profile: dev

  # ─── H2 in-memory (no external DB needed for local dev) ──────────────────────
  datasource:
    url: jdbc:h2:mem:mealio;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

mealio:
  firebase:
    enabled: false          # Firebase disabled in dev — headcount returns mock data
